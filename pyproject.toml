[project]
name = "athenix-ai"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-dotenv",
    "chromadb>=1.5.9",
    "onnxruntime"
]

[tool.vercel]
entrypoint = "apps.api.app.main:app"